<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Will You Be My Valentine?</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ================================= -->
    <!-- MÀN HÌNH CHÍNH -->
    <!-- ================================= -->

    <div class="container" id="mainScreen">

        <!-- ẢNH CUTE -->

        <div class="cute-image">

            <img src="icon1.gif" alt="cute animation">

        </div>


        <!-- CÂU HỎI -->

        <h1>
            Will you be my Valentine?
        </h1>


        <!-- MESSAGE -->

        <p id="message">
            Give me a chance!
        </p>


        <!-- BUTTONS -->

        <div class="buttons">

            <button id="yesBtn">
                YES
            </button>

            <button id="noBtn">
                NO
            </button>

        </div>

    </div>


    <!-- ================================= -->
    <!-- MÀN HÌNH SAU KHI YES -->
    <!-- ================================= -->

    <div class="success-screen" id="successScreen">

        <!-- ẢNH CUTE -->

        <div class="success-image">

            <img src="icon2.gif" alt="cute animation">

        </div>


        <!-- CHỮ LỚN -->

        <h2>
            YAYYYYYYYYYYYYYY 💗
        </h2>


        <!-- CHỮ NHỎ -->

        <p class="success-text">

            I LOVE YOUUUU SO MUCHHHH 🥹💗

            <br>

            Hehe... you said YESSS 🥹💕
            <br>
            Too late, you're my Valentine now 😼

        </p>

    </div>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="script.js"></script>

</body>

</html>
